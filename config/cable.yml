development:
  adapter: async

test:
  adapter: test

production:
  <% if ENV["REDIS_URL"].present? %>
  adapter: redis
  url: <%= ENV["REDIS_URL"] %>
  channel_prefix: wishful_production
  <% else %>
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
  <% end %>
